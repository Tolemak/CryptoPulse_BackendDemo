name: Test and Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: Tolemak/.github/.github/workflows/php-ci.yml@c2cb527de1abeb7ad38907fb52dfb1c9cedbbcec # v1.4.0
    with:
      php-version: "8.4"
      extensions: ctype, iconv, mbstring
      cs-tool: none
      redis-version: 7-alpine
      env: APP_ENV=test

  image:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/tolemak/cryptopulse-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the PHP base
        run: docker build --target base -t cryptopulse-base container/php
      - name: Build the runtime image
        run: >
          docker build --provenance=false -f container/Dockerfile.app
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
      - name: Smoke test the image
        run: bash container/smoke.sh "$IMAGE:${{ github.sha }}"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push
        id: push
        run: |
          docker push --quiet "$IMAGE:${{ github.sha }}"
          docker push --quiet "$IMAGE:latest"
          echo "digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

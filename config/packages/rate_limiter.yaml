framework:
    rate_limiter:
        binance_api:
            policy: 'token_bucket'
            limit: 10
            rate: { interval: '1 minute', amount: 10 }
            storage_service: app.rate_limiter.storage
        kraken_api:
            policy: 'token_bucket'
            limit: 5
            rate: { interval: '1 second' }
            storage_service: app.rate_limiter.storage
        coinbase_api:
            policy: 'token_bucket'
            limit: 64
            rate: { interval: '1 minute', amount: 64 }
            storage_service: app.rate_limiter.storage
        coingecko_api:
            policy: 'token_bucket'
            limit: 5
            rate: { interval: '1 minute' }
            storage_service: app.rate_limiter.storage
        api_inbound:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'
            storage_service: app.rate_limiter.storage
        alert_create:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'
            storage_service: app.rate_limiter.storage
        manual_refresh:
            policy: 'fixed_window'
            limit: 1
            interval: '60 seconds'
            storage_service: app.rate_limiter.storage

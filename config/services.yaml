# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    env(APP_SECRET): ''
    env(REDIS_URL): 'redis://localhost:6379'
    env(LOCK_DSN): 'flock'
    env(CORS_ALLOW_ORIGIN): '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
    env(DEFAULT_URI): 'http://localhost'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    app.rate_limiter.storage:
        class: Symfony\Component\RateLimiter\Storage\CacheStorage
        arguments:
            - '@cache.rate_limiter'

    app.http_client.webhook.transport:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
        arguments:
            - { max_redirects: 0, timeout: 5, max_duration: 10 }

    app.http_client.webhook:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments:
            - '@app.http_client.webhook.transport'

    App\Service\Alert\WebhookNotifier:
        arguments:
            $client: '@app.http_client.webhook'

    App\Service\Exchange\BinanceClient:
        arguments:
            $client: '@binance.client'
            $limiterFactory: '@limiter.binance_api'

    App\Service\Exchange\KrakenClient:
        arguments:
            $client: '@kraken.client'
            $limiterFactory: '@limiter.kraken_api'

    App\Service\Exchange\CoinbaseClient:
        arguments:
            $client: '@coinbase.client'
            $limiterFactory: '@limiter.coinbase_api'

    Predis\ClientInterface:
        class: Predis\Client
        arguments:
            - '%env(REDIS_URL)%'
